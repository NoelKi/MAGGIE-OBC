[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lisa-odisee-uart"
version = "0.1.0"
description = "Parser fuer das LISA-ODISEE UART-Protokoll gemaess ICD v0.7"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
plot = ["matplotlib>=3.5.0"]


[project.scripts]
lisa-parse = "lisa.cli:main"

[tool.setuptools]
packages = ["lisa"]

[tool.setuptools.data-files]
"." = ["sample_data.json"]
