[env:teensy41]
platform = teensy
board = teensy41
framework = arduino

monitor_speed = 115200
monitor_filters = send_on_enter
monitor_eol = LF
monitor_echo = yes

build_flags =
    -O3
    -Wall
    -Wextra

; Default-Build: nur die echte Firmware, keine hardwareTest-Dateien.
; Zum Testen einer Hardware-Komponente die passende Zeile aktivieren
; (und main.cpp ggf. ausschließen, da auch dort setup()/loop() steht).
build_src_filter =
    +<*>
    -<hardwareTest/imu.cpp>
    -<hardwareTest/force.cpp>
    -<hardwareTest/motor.cpp>
    +<main.cpp>

lib_deps =
    https://github.com/bogde/HX711.git
    https://github.com/bolderflight/bmi088-arduino.git
    paulstoffregen/Encoder

; Handbetrieb fuer HDRM-Motor 1 am Tisch (src/hardwareTest/hdrm_bench.cpp).
; Faehrt die echte MotorHAL ohne Zustandsmaschine: pio run -e bench -t upload
; Danach mit `pio run -e teensy41 -t upload` wieder die Firmware flashen.
[env:bench]
platform = teensy
board = teensy41
framework = arduino

monitor_speed = 115200
monitor_filters = send_on_enter
monitor_eol = LF
monitor_echo = yes

build_flags =
    -O2
    -Wall
    -Wextra

build_src_filter =
    -<*>
    +<hardwareTest/hdrm_bench.cpp>
    +<hal/motor_hal.cpp>

lib_deps =
    paulstoffregen/Encoder

; Selbstmessung der Software-PWM auf Pin 40/41 (src/hardwareTest/softpwm_check.cpp).
; Baut die echte MotorHAL mit ein und misst deren Ausgang per Pin-Rueckabtastung.
[env:softpwm]
platform = teensy
board = teensy41
framework = arduino

monitor_speed = 115200
monitor_filters = send_on_enter
monitor_eol = LF
monitor_echo = yes

build_flags =
    -O2
    -Wall
    -Wextra

build_src_filter =
    -<*>
    +<hardwareTest/softpwm_check.cpp>
    +<hal/motor_hal.cpp>

lib_deps =
    paulstoffregen/Encoder