[env:teensy41]
platform = teensy
board = teensy41
framework = arduino

monitor_speed = 115200
monitor_filters = send_on_enter
monitor_eol = LF
monitor_echo = yes

build_flags =
    -O3
    -Wall
    -Wextra

; Default-Build: nur die echte Firmware, keine hardwareTest-Dateien.
; Zum Testen einer Hardware-Komponente die passende Zeile aktivieren
; (und main.cpp ggf. ausschließen, da auch dort setup()/loop() steht).
build_src_filter =
    +<*>
    -<hardwareTest/>
    + <main.cpp>
    ; +<hardwareTest/imu.cpp>
    ; +<hardwareTest/force.cpp>
    ; +<hardwareTest/motor.cpp>

lib_deps =
    https://github.com/bogde/HX711.git
    https://github.com/bolderflight/bmi088-arduino.git